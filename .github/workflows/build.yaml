name: Compile Tempest

on: [push]

jobs:
  cpp-linux-build:
    name: Build Linux (${{ matrix.config }})
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebugInfo ]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update apt-get
        run: sudo apt-get update -y

      - name: Configure Ubuntu Libraries
        run: sudo apt-get install -y libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev mesa-common-dev

      - name: Install Clang 22
        uses: egor-tensin/setup-clang@v2.2
        with:
          version: 22
          platform: x64

      - name: Install Premake
        uses: Jarod42/install-premake5@v4
        with:
          ref: master

      - name: Generate Project Files
        run: premake5 ninja --cc=clang --shell=posix --shared-engine --rhi-vulkan

      - name: Fetch Dependencies
        run: premake5 fetch

      - name: Build
        run: ninja -C build/ninja ${{ matrix.config }}_x64

      - name: Run Tests
        run: |
          binDir="bin/${{ matrix.config }}/linux-clang"
          if [ -f "$binDir/core-tests" ]; then "$binDir/core-tests" --gtest_brief=1; fi
          if [ -f "$binDir/ecs-tests" ]; then "$binDir/ecs-tests" --gtest_brief=1; fi
          if [ -f "$binDir/event-tests" ]; then "$binDir/event-tests" --gtest_brief=1; fi
          if [ -f "$binDir/serialization-tests" ]; then "$binDir/serialization-tests" --gtest_brief=1; fi
          if [ -f "$binDir/assets-tests" ]; then "$binDir/assets-tests" --gtest_brief=1; fi
          if [ -f "$binDir/render-graph-tests" ]; then "$binDir/render-graph-tests" --gtest_brief=1; fi

  cpp-windows-build:
    name: Build Windows ${{ matrix.generator }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ windows-2022 ]
        config: [ Debug, Release, RelWithDebugInfo ]
        generator: [ vs2022 ]
        include:
          - generator: vs2022
            sln_file: build/vs2022/Tempest.sln
            out_dir: windows-msc-v143
          - generator: vs2026
            os: windows-latest
            config: Debug
            sln_file: build/vs2026/Tempest.slnx
            out_dir: windows-msc-v145
          - generator: vs2026
            os: windows-latest
            config: Release
            sln_file: build/vs2026/Tempest.slnx
            out_dir: windows-msc-v145
          - generator: vs2026
            os: windows-latest
            config: RelWithDebugInfo
            sln_file: build/vs2026/Tempest.slnx
            out_dir: windows-msc-v145

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Premake
        uses: Jarod42/install-premake5@v4
        with:
          ref: master

      - name: Generate Project Files
        run: premake5 ${{ matrix.generator }} --shared-engine --rhi-vulkan

      - name: Fetch Dependencies
        run: premake5 fetch

      - name: Build
        run: msbuild ${{ matrix.sln_file }} -p:Configuration=${{ matrix.config }} -p:Platform=x64 -m

      - name: Run Tests
        shell: pwsh
        run: |
          $binDir = "bin/${{ matrix.config }}/${{ matrix.out_dir }}"
          if (Test-Path "$binDir/core-tests.exe") { & "$binDir/core-tests.exe" --gtest_brief=1 }
          if (Test-Path "$binDir/ecs-tests.exe") { & "$binDir/ecs-tests.exe" --gtest_brief=1 }
          if (Test-Path "$binDir/event-tests.exe") { & "$binDir/event-tests.exe" --gtest_brief=1 }
          if (Test-Path "$binDir/serialization-tests.exe") { & "$binDir/serialization-tests.exe" --gtest_brief=1 }
          if (Test-Path "$binDir/assets-tests.exe") { & "$binDir/assets-tests.exe" --gtest_brief=1 }
          if (Test-Path "$binDir/render-graph-tests.exe") { & "$binDir/render-graph-tests.exe" --gtest_brief=1 }
